<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>notes app</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
    <div class="container">
        <h1><img src="notes image.jpg">Notes</h1>
        <button class="notes"><img src="pencil.png"> create notes</button>
        <div class="notes-container">
           <!-- <p contenteditable="true" class="input-box"> <img src="delete.png"></p> -->
        </div> 
    </div>

    <script>
        const notescontainer=document.querySelector(".notes-container");
       const createnotes=document.querySelector(".notes");
       let notes=document.querySelectorAll(".input-box");
       function updatestorage(){
         localStorage.setItem("notes",notescontainer.innerHTML);
       }

       function showstorage(){
          notescontainer.innerHTML=localStorage.getItem("notes");
       }
    showstorage();
      
       createnotes.addEventListener("click",()=>{
                          let inputbox=document.createElement("p");
                         let img=document.createElement("img");
                         inputbox.className="input-box";
                         inputbox.setAttribute("contenteditable","true");
                         img.src="delete.png";
                         notescontainer.appendChild(inputbox).appendChild(img);


       })
       notescontainer.addEventListener("click",(e)=>{
                        if(e.target.tagName==="IMG"){
                            e.target.parentElement.remove();
                            updatestorage();
                        }
                        else if(e.target.tagName==="P"){
                            notes=document.querySelectorAll(".input-box");
                            notes.forEach(nt=>{
                                nt.onkeyup=function(){
                                    updatestorage();
                                }
                            })

                        }
       })
         document.addEventListener('keydown',(e)=>{
               if(e.key=="enter"){
                 document.execCommand("insertlinebreak");
                 e.preventDefault();
               }
               })
              


    </script>
</body>
</html>
